# 설치 파일 만들기: 태그(v*)를 올리거나 Actions 탭에서 직접 실행
# Windows: .exe(NSIS) + .msi / macOS: .dmg (서명 없음) / Linux: .deb .AppImage
name: 설치 파일 빌드

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '만들 운영체제 (windows / all)'
        default: 'windows'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:engine

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            enabled: true
          - os: macos-latest
            args: '--target universal-apple-darwin'
            enabled: ${{ github.event_name == 'push' || inputs.platforms == 'all' }}
          - os: ubuntu-22.04
            args: ''
            enabled: ${{ github.event_name == 'push' || inputs.platforms == 'all' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ matrix.enabled }}
      - name: Linux 빌드 도구
        if: ${{ matrix.enabled && startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        if: ${{ matrix.enabled }}
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ matrix.enabled }}
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        if: ${{ matrix.enabled }}
        with: { workspaces: './src-tauri -> target' }
      - run: npm ci
        if: ${{ matrix.enabled }}
      - uses: tauri-apps/tauri-action@v0
        if: ${{ matrix.enabled }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 자동 업데이트 서명: 저장소 Secrets에 TAURI_SIGNING_PRIVATE_KEY를 넣어 둔다 (없으면 빌드가 실패한다).
          # 키에 암호가 없으면 PASSWORD 비밀 값은 만들지 않아도 된다 (빈 값으로 들어간다).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('Air PDF {0}', github.ref_name) || '' }}
          releaseDraft: true
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.enabled }}
        with:
          name: air-pdf-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.sig
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  web:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: air-pdf-web, path: dist }
