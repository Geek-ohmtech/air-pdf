[package]
name = "air-pdf"
version = "0.3.0"
description = "가볍고 빠른 PDF 뷰어 + 편집기"
authors = ["Air PDF"]
edition = "2021"
license = "MIT"

[lib]
name = "air_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

# 작고 빠른 실행 파일
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
